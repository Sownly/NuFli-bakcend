services:
  postgres:
    image: postgres:16-alpine
    container_name: nufli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nufli_db
      POSTGRES_USER: nufli_user
      POSTGRES_PASSWORD: nufli_password
    ports:
      - "5432:5432"
    volumes:
      - nufli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nufli_user -d nufli_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nufli-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nufli_db
      SPRING_DATASOURCE_USERNAME: nufli_user
      SPRING_DATASOURCE_PASSWORD: nufli_password
      JWT_SECRET: 4c7b8e1a9f3d2c5e7b0a1d4f6c8e9b2a5d7c0e3f1a6b8c9d0e2f4a6b8c0d2e4f
      JWT_ACCESS_TOKEN_EXPIRATION_MS: 900000
      JWT_REFRESH_TOKEN_EXPIRATION_MS: 2592000000

volumes:
  nufli_pgdata:
