server:
  port: 8080

spring:
  application:
    name: nufli-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/nufli_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:nufli_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:nufli_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:4c7b8e1a9f3d2c5e7b0a1d4f6c8e9b2a5d7c0e3f1a6b8c9d0e2f4a6b8c0d2e4f}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 2592000000 # 30 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.sownly.nufli: DEBUG
